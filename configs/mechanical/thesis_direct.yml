study: mechanical
mode: thesis
geometry:
  length: 2.0
  width: 1.0
  thickness: 0.05
  resolution: 64
  degree: 2
  n_vertical_interfaces: 0
  n_horizontal_interfaces: 0
rigidity: {Dx: 9500.0, Dy: 9500.0, Dxy: 2850.0, Ds: 3320.0}
foundation: {stiffness: 10000000.0, uplift_factor: 0.001}
load:
  kind: patch
  amplitude: -7000.0
  x0: 1.0
  y0: 0.5
  size_x: 0.351
  size_y: 0.351
boundary_condition: free_edge
solver: {absolute: 1.0e-8, relative: 1.0e-8, maximum_iterations: 25}
sampling:
  design: latin_hypercube
  n_samples: 1000
  seed: 100
  ranges:
    Dx: [5000.0, 20000.0]
    Dy: [5000.0, 20000.0]
    Dxy: [1000.0, 5000.0]
    Ds: [1000.0, 5000.0]
    foundation_stiffness: [1000000.0, 10000000.0]
    load_amplitude: [-10000.0, -2000.0]
rom:
  split: {train: 0.8, validation: 0.1, test: 0.1, seed_train: 100, seed_holdout: 101}
  active_methods: [pod-galerkin, pod-proj, podi-rbf, podi-linear, pod-gpr, pod-nn]
output: results/mechanical/thesis_direct
